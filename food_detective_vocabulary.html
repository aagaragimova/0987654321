<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Detective — Vocabulary Challenge</title>
<style>
:root{--cream:#fbf7ef;--paper:#fffdf8;--ink:#2f332b;--green:#63785b;--sage:#dfe8d7;--gold:#e9bd61;--pink:#f3dfd7;--line:#e7e0d4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}
.app{width:min(760px,100%);background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,42px);box-shadow:0 18px 50px #4b49350d}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--green);background:var(--sage);padding:9px 12px;border-radius:99px}
.counter{font-size:14px;color:#777b70;font-weight:700}
h1{font-size:clamp(28px,5vw,42px);line-height:1.05;margin:25px 0 8px;letter-spacing:-.04em}
.subtitle{color:#73776d;margin:0 0 26px;line-height:1.5}
.progress{height:8px;background:#eee9df;border-radius:99px;overflow:hidden;margin-bottom:28px}
.bar{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .25s}
.word-card{background:#f5f1e8;border-radius:22px;text-align:center;padding:30px 18px;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#777b70;font-weight:800}
.word{font-size:clamp(30px,7vw,48px);font-weight:900;letter-spacing:.025em;margin-top:9px;overflow-wrap:anywhere}
.prompt{text-align:center;font-size:15px;font-weight:700;margin:0 0 15px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{min-height:64px;padding:15px;border:1.5px solid var(--line);border-radius:16px;background:white;color:var(--ink);font-size:16px;font-weight:650;cursor:pointer;transition:.15s;text-align:left}
.answer:hover:not(:disabled){border-color:var(--green);background:#f6f8f3;transform:translateY(-1px)}
.answer:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.answer:disabled{cursor:default}
.answer.correct{background:var(--sage);border-color:var(--green)}
.answer.wrong{background:var(--pink);border-color:#c7836d}
.feedback{min-height:28px;margin:16px 0 4px;font-weight:750;text-align:center}
.feedback.good{color:#42683d}.feedback.bad{color:#a44f3e}
.actions{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:99px;padding:13px 22px;font-size:15px;font-weight:800;cursor:pointer}
.primary{background:var(--green);color:white}.primary:hover{background:#506449}
.secondary{background:#f0ece3;color:var(--ink)}
.hidden{display:none!important}
.result{text-align:center;padding:18px 0 4px}
.result .emoji{font-size:54px}
.result h2{font-size:32px;margin:10px 0}
.score{font-size:22px;font-weight:850;margin:12px 0}
.small{font-size:14px;color:#777b70;line-height:1.5}
@media(max-width:520px){.answers{grid-template-columns:1fr}.answer{min-height:56px}.app{border-radius:22px}.word-card{padding:25px 12px}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><span class="tag">🥑 Food Detective</span><span class="counter" id="counter">Question 1 of 17</span></div>
  <h1>Vocabulary Challenge</h1>
  <p class="subtitle">Choose the correct Russian meaning. Think fast, detective!</p>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <section id="quiz">
    <div class="word-card"><div class="eyebrow">What does this word mean?</div><div class="word" id="word">CRUNCHY</div></div>
    <p class="prompt">Choose one answer:</p>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="actions"><button class="btn primary hidden" id="next">Next word →</button></div>
  </section>
  <section class="result hidden" id="result">
    <div class="emoji" id="resultEmoji">🎉</div>
    <h2>Case closed!</h2>
    <p class="subtitle">You finished the vocabulary challenge.</p>
    <div class="score" id="score"></div>
    <p class="small" id="message"></p>
    <div class="actions"><button class="btn primary" id="restart">Play again ↻</button></div>
  </section>
</main>
<script>
const pairs = [
 ["sweetcorn","кукуруза"],["aubergines","баклажаны"],["public eye","на виду у публики; под вниманием общественности"],
 ["pale","бледный"],["low-calorie","низкокалорийный"],["sweetened","подслащённый"],["swap","менять; обменивать"],
 ["appealing","привлекательный; заманчивый"],["maple syrup","кленовый сироп"],["wholemeal bread","цельнозерновой хлеб"],
 ["baby food","детское питание"],["stale","черствый; несвежий"],["bland","пресный; безвкусный"],["lean","нежирный"],
 ["ripe","спелый"],["crunchy","хрустящий"],["wacky","странный; чудаковатый"]
];
let order=[],index=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle([...pairs.keys()]);index=0;score=0;locked=false;$('quiz').classList.remove('hidden');$('result').classList.add('hidden');render()}
function render(){
 locked=false;
 const [word,meaning]=pairs[order[index]];
 $('counter').textContent=`Question ${index+1} of ${pairs.length}`;
 $('bar').style.width=`${index/pairs.length*100}%`;
 $('word').textContent=word;
 $('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');
 const wrong=shuffle(pairs.filter((p,i)=>i!==order[index]).map(p=>p[1])).slice(0,3);
 const choices=shuffle([meaning,...wrong]);
 $('answers').innerHTML='';
 choices.forEach(choice=>{
  const b=document.createElement('button');b.className='answer';b.textContent=choice;
  b.addEventListener('click',()=>choose(b,choice,meaning));$('answers').appendChild(b);
 });
}
function choose(btn,choice,meaning){
 if(locked)return;locked=true;
 const buttons=[...document.querySelectorAll('.answer')];
 buttons.forEach(b=>{b.disabled=true;if(b.textContent===meaning)b.classList.add('correct')});
 if(choice===meaning){score++;$('feedback').textContent='✓ Correct! Great job!';$('feedback').classList.add('good')}
 else{btn.classList.add('wrong');$('feedback').textContent=`Not quite! Correct answer: ${meaning}`;$('feedback').classList.add('bad')}
 $('bar').style.width=`${(index+1)/pairs.length*100}%`;
 $('next').textContent=index===pairs.length-1?'See my score →':'Next word →';$('next').classList.remove('hidden');
}
$('next').addEventListener('click',()=>{index++;if(index<pairs.length)render();else finish()});
function finish(){
 $('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('counter').textContent='Challenge complete';$('bar').style.width='100%';
 $('score').textContent=`Your score: ${score} / ${pairs.length}`;
 const pct=score/pairs.length;
 $('resultEmoji').textContent=pct>=.85?'🏆':pct>=.6?'🌟':'📚';
 $('message').textContent=pct>=.85?'Amazing work, detective! You know these words really well.':pct>=.6?'Good effort! Play again to make the vocabulary stick.':'Keep practising — every round will make you stronger!';
}
$('restart').addEventListener('click',start);
start();
</script>
</body>
</html>
